<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jev 判定チャット</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --accent: #5ec8f8;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --user-bubble: #2b6ef2;
    --bot-bubble: #262a33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px;
    border-bottom: 1px solid #2a2d35;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
  }
  header p {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border-bottom-left-radius: 4px;
  }
  .bot.judge1 { border-left: 3px solid #4caf50; }
  .bot.judge0 { border-left: 3px solid #f44336; }
  .bot.error { border-left: 3px solid #ff9800; color: #ffcc80; }
  .typing { color: var(--muted); font-size: 13px; padding: 0 16px; }
  form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #2a2d35;
  }
  input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid #2a2d35;
    color: var(--text);
    padding: 12px 14px;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
  }
  button {
    background: var(--accent);
    border: none;
    color: #0f1115;
    font-weight: 600;
    padding: 0 20px;
    border-radius: 20px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Jev 判定チャット</h1>
    <p>メッセージを送ると、特定の内容が含まれるか判定して返事をします</p>
  </header>
  <div class="messages" id="messages"></div>
  <div class="typing" id="typing" style="display:none;">判定中...</div>
  <form id="form">
    <input type="text" id="input" placeholder="メッセージを入力" autocomplete="off" required>
    <button type="submit">送信</button>
  </form>
</div>

<script>
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const messages = document.getElementById('messages');
  const typing = document.getElementById('typing');

  function addBubble(text, cls) {
    const div = document.createElement('div');
    div.className = 'bubble ' + cls;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addBubble(message, 'user');
    input.value = '';
    typing.style.display = 'block';

    try {
      const res = await fetch('/api/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });
      const data = await res.json();
      typing.style.display = 'none';

      if (!res.ok) {
        addBubble(data.error || 'エラーが発生しました', 'bot error');
        return;
      }
      addBubble(data.reply, 'bot judge' + data.judgment);
    } catch (err) {
      typing.style.display = 'none';
      addBubble('通信エラー: ' + err.message, 'bot error');
    }
  });
</script>
</body>
</html>
